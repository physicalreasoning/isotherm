name: dashboard
# Publishes the results dashboard to GitHub Pages. Rebuilt on every push to main and daily
# after the shadow job settles, so the Live tab tracks the ledger without a manual step.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the shadow ledger
        run: git fetch -q origin shadow-ledger:refs/remotes/origin/shadow-ledger || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the dashboard (standard library only)
        run: python scripts/dashboard.py --standalone site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
