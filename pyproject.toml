[project]
name = "pmdecide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "berezucc", email = "96497560+berezucc@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
